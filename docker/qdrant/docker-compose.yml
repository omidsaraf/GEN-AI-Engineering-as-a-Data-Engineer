version: '3.9'

services:
  qdrant:
    image: qdrant/qdrant:v1.2.0
    container_name: qdrant
    ports:
      - "6333:6333"       # API port
      - "6334:6334"       # gRPC port (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333

volumes:
  qdrant_storage:
